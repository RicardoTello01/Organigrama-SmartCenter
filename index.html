<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organigrama Smart Center</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero-chip">● Organigrama corporativo</div>
      <h1>Directorio de Personal</h1>
      <p>Tarjetas de identificación y perfiles del equipo</p>

      <div class="hero-divider">
        <span></span><i></i><span></span><b></b><span></span>
      </div>

      <div class="legend">
        <span class="legend-item legend-directivo"><i></i> Directivo</span>
        <span class="legend-item legend-gerencial"><i></i> Gerencial</span>
        <span class="legend-item legend-operativo"><i></i> Operativo</span>
        <span class="legend-separator">|</span>
        <span class="legend-note">Pasa el mouse sobre la tarjeta para resaltar la etiqueta</span>
      </div>
    </header>

    <section class="toolbar">
      <input type="text" id="searchInput" placeholder="Buscar por nombre, puesto o área..." />
      <button id="expandAllBtn" type="button">Expandir todo</button>
      <button id="collapseAllBtn" type="button">Contraer todo</button>
    </section>

    <main>
      <section id="org-root" class="org-root"></section>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
